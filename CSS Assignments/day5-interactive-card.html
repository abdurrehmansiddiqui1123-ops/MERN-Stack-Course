<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Card</title>
    <style>

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      /* ===================== Card ===================== */
      .card {
        position: relative;             /* Requirement: position relative on the card */
        width: 280px;
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        border: 1px solid #ddd;

        /* Requirement: transition for smooth animation, at least 0.3s */
        transition: transform 0.3s, box-shadow 0.3s;
      }

      /* Requirement: hover effect - scale up + shadow */
      .card:hover {
        transform: scale(1.05);          /* Requirement: transform function */
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);   /* Requirement: lift with shadow */
      }

      /* ===================== Badge: positioned on top of the card ===================== */
      .badge {
        position: absolute;              /* Requirement: position absolute on child element */
        top: -10px;
        right: -10px;
        background-color: orange;
        color: white;
        font-size: 12px;
        font-weight: bold;
        padding: 6px 10px;
        border-radius: 20px;
      }

      /* ===================== Card Image ===================== */
      .card-image {
        width: 100%;
        height: 150px;
        background-color: #dde2e8;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      /* ===================== Card Text ===================== */
      .card h3 {
        margin: 0 0 8px 0;
        color: #2d2d2d;
        transition: color 0.3s;          /* Requirement: transition on text color too */
      }

      /* Requirement: change color of at least one element on hover */
      .card:hover h3 {
        color: #4a6fa5;
      }

      .card p {
        color: #666;
        font-size: 14px;
        line-height: 1.6;
      }

      /* ===================== Button ===================== */
      .card button {
        width: 100%;
        background-color: #4a6fa5;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .card button:hover {
        background-color: #3a5a85;
      }

    </style>
  </head>
  <body>

    <div class="card">
      <span class="badge">New</span>

      <div class="card-image"></div>

      <h3>Interactive Card</h3>
      <p>Hover over this card to see it scale up, lift with a shadow, and change color.</p>

      <button>Learn More</button>
    </div>

  </body>
</html>
